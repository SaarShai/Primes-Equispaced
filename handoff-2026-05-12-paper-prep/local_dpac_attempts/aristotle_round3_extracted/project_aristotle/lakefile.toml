name = "RequestProject"
defaultTargets = ["CorrectedBInfty", "FareyBridgeIdentity", "FareySignPattern", "LocalPerronResidue", "MertensSpectroscopeUniversality"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "CorrectedBInfty"
globs = ["CorrectedBInfty"]

[[lean_lib]]
name = "FareyBridgeIdentity"
globs = ["FareyBridgeIdentity"]

[[lean_lib]]
name = "FareySignPattern"
globs = ["FareySignPattern"]

[[lean_lib]]
name = "LocalPerronResidue"
globs = ["LocalPerronResidue"]

[[lean_lib]]
name = "MertensSpectroscopeUniversality"
globs = ["MertensSpectroscopeUniversality"]
